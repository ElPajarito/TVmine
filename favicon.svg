<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- TVmine: old movie projector -->
  <circle cx="32" cy="32" r="32" fill="#141c36"/>
  <!-- light beam -->
  <polygon points="51,33.5 59,25.5 59,46.5 51,41.5" fill="#ffe2a6" opacity="0.85"/>
  <!-- film reels -->
  <circle cx="21" cy="18.5" r="10" fill="#fbf7ec"/>
  <circle cx="38.5" cy="21" r="7" fill="#fbf7ec"/>
  <g fill="#141c36">
    <circle cx="21" cy="18.5" r="2.8"/>
    <circle cx="21" cy="12" r="1.9"/>
    <circle cx="15.3" cy="21.7" r="1.9"/>
    <circle cx="26.7" cy="21.7" r="1.9"/>
    <circle cx="38.5" cy="21" r="2"/>
    <circle cx="38.5" cy="16.6" r="1.3"/>
    <circle cx="34.7" cy="23.2" r="1.3"/>
    <circle cx="42.3" cy="23.2" r="1.3"/>
  </g>
  <!-- body -->
  <rect x="12" y="26.5" width="34" height="17.5" rx="4.5" fill="#fbf7ec"/>
  <!-- side reel window -->
  <circle cx="20.5" cy="35.2" r="4.2" fill="#e8a94f"/>
  <circle cx="20.5" cy="35.2" r="1.6" fill="#fbf7ec"/>
  <!-- lens barrel -->
  <rect x="44" y="30.5" width="8.5" height="10" rx="2.4" fill="#e8a94f"/>
  <!-- legs -->
  <rect x="16.5" y="43" width="3.4" height="8" rx="1.6" fill="#fbf7ec" transform="rotate(14 18.2 47)"/>
  <rect x="37.5" y="43" width="3.4" height="8" rx="1.6" fill="#fbf7ec" transform="rotate(-14 39.2 47)"/>
</svg>
